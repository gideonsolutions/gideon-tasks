name: License Check

on:
  pull_request:
    branches: [main]

jobs:
  check-license:
    name: Verify License
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check LICENSE.md exists
        run: test -f LICENSE.md

      # The Rust backend this step used to check (backend/Cargo.toml) was replaced by the single
      # Next.js app in frontend/; check that the licence is still GCOSL v1.0 instead.
      - name: Check LICENSE.md is GCOSL v1.0
        run: |
          grep -q 'Gideon Christian Open Source License (GCOSL)' LICENSE.md
          grep -q 'Version 1.0' LICENSE.md
